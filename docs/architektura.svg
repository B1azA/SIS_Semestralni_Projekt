<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="820" fill="#ffffff"/>

  <text x="550" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#12233f">Architektura AI Tutora Matematické analýzy (FSI VUT)</text>

  <!-- Student -->
  <rect x="450" y="62" width="200" height="44" rx="22" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="550" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2b4a">Student / uživatel</text>

  <line x1="550" y1="106" x2="550" y2="138" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- UI -->
  <rect x="120" y="140" width="860" height="66" rx="12" fill="#dbe9ff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="550" y="167" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a2b4a">Uživatelské rozhraní — Streamlit (app.py)</text>
  <text x="550" y="190" text-anchor="middle" font-size="12.5" fill="#33465e">chat • volba režimu, kapitoly a obtížnosti • vykreslení LaTeXu • zobrazení použitých zdrojů</text>

  <line x1="550" y1="206" x2="550" y2="234" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Orchestration -->
  <rect x="120" y="234" width="860" height="66" rx="12" fill="#e6e0ff" stroke="#6a5acd" stroke-width="1.5"/>
  <text x="550" y="261" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2b1a5e">Orchestrační vrstva (app.py)</text>
  <text x="550" y="284" text-anchor="middle" font-size="12.5" fill="#3a2e63">systémový prompt • RAG retrieval • tool-loop • historie konverzace • reset při změně nastavení</text>

  <!-- arrows orchestration -> services -->
  <line x1="300" y1="300" x2="215" y2="348" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="550" y1="300" x2="550" y2="348" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="800" y1="300" x2="885" y2="348" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="60" y="350" width="300" height="120" rx="12" fill="#ffe8cc" stroke="#d9822b" stroke-width="1.5"/>
  <text x="210" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#6b3d00">LLM — OpenAI GPT-4o-mini</text>
  <text x="210" y="404" text-anchor="middle" font-size="12" fill="#6b3d00">generuje odpovědi a rozhoduje,</text>
  <text x="210" y="422" text-anchor="middle" font-size="12" fill="#6b3d00">kdy zavolat ověřovací nástroj</text>
  <text x="210" y="448" text-anchor="middle" font-size="11.5" fill="#8a6a3a">vstup: systémový prompt + kontext z RAG</text>

  <!-- Math core -->
  <rect x="400" y="350" width="300" height="120" rx="12" fill="#d9f2d9" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="550" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#14501b">Matematické jádro</text>
  <text x="550" y="404" text-anchor="middle" font-size="12" fill="#14501b">src/math_core.py — SymPy</text>
  <text x="550" y="426" text-anchor="middle" font-size="12" fill="#14501b">verify_equivalence() • compute()</text>
  <text x="550" y="450" text-anchor="middle" font-size="11.5" fill="#3a6b3a">deterministické ověření — žádné halucinace</text>

  <!-- RAG -->
  <rect x="740" y="350" width="300" height="120" rx="12" fill="#fff2b8" stroke="#b8860b" stroke-width="1.5"/>
  <text x="890" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5200">Znalostní vrstva (RAG)</text>
  <text x="890" y="404" text-anchor="middle" font-size="12" fill="#6b5200">src/rag.py</text>
  <text x="890" y="424" text-anchor="middle" font-size="12" fill="#6b5200">vyhledání nejpodobnějších pasáží</text>
  <text x="890" y="448" text-anchor="middle" font-size="11.5" fill="#8a6a2a">vkládá kontext do systémového promptu</text>

  <!-- RAG <-> DB -->
  <line x1="890" y1="470" x2="890" y2="518" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- DB -->
  <rect x="740" y="518" width="300" height="72" rx="12" fill="#cfe8e8" stroke="#2b7d7d" stroke-width="1.5"/>
  <text x="890" y="548" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d4747">Vektorová databáze — ChromaDB</text>
  <text x="890" y="571" text-anchor="middle" font-size="12" fill="#0d4747">data/db • 539 pasáží • embeddingy text-embedding-3-small</text>

  <!-- offline -> DB -->
  <line x1="890" y1="648" x2="890" y2="592" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Offline pipeline -->
  <rect x="120" y="648" width="860" height="132" rx="12" fill="#eef0f2" stroke="#8a99a8" stroke-width="1.5"/>
  <text x="550" y="676" text-anchor="middle" font-size="15" font-weight="700" fill="#2a3947">Offline zpracování znalostní báze (notebook / src/build_index.py)</text>

  <rect x="150" y="700" width="150" height="52" rx="8" fill="#ffffff" stroke="#8a99a8"/>
  <text x="225" y="731" text-anchor="middle" font-size="12.5" fill="#2a3947">data/raw/*.pdf</text>

  <rect x="330" y="700" width="150" height="52" rx="8" fill="#ffffff" stroke="#8a99a8"/>
  <text x="405" y="731" text-anchor="middle" font-size="12.5" fill="#2a3947">pymupdf4llm</text>

  <rect x="510" y="700" width="150" height="52" rx="8" fill="#ffffff" stroke="#8a99a8"/>
  <text x="585" y="731" text-anchor="middle" font-size="12.5" fill="#2a3947">data/*.md</text>

  <rect x="690" y="700" width="260" height="52" rx="8" fill="#ffffff" stroke="#8a99a8"/>
  <text x="820" y="722" text-anchor="middle" font-size="12" fill="#2a3947">dělení na pasáže</text>
  <text x="820" y="740" text-anchor="middle" font-size="12" fill="#2a3947">+ OpenAI embeddingy</text>

  <line x1="300" y1="726" x2="328" y2="726" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="726" x2="508" y2="726" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="726" x2="688" y2="726" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="776" text-anchor="middle" font-size="11.5" fill="#5a6874">Běží jednorázově před spuštěním aplikace; výsledek je uložen v ChromaDB a aplikace ho jen čte.</text>
</svg>
