[project]
name = "semestralka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josef Blažek", email = "blaza004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lark>=1.3.1",
    "numpy>=2.5.5",
    "openai>=3.55.1",
    "plotly>=7.1.0",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "sympy>=1.14.0",
]

[project.scripts]
semestralka = "semestralka:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
